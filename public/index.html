<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accedi - Crono Service</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="pagina-login">
  <div class="riquadro-login">
    <div class="logo-login">
      <div class="icona">⏱</div>
      <div>
        <div class="titolo">Crono Service</div>
        <div class="sottotitolo">Gestione servizi di cronometraggio sportivo</div>
      </div>
    </div>

    <div id="area-errore"></div>

    <form id="modulo-login">
      <div class="campo">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="nome.cognome@cronoservice.it">
      </div>
      <div class="campo">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="bottone-primario" style="width:100%;justify-content:center;" id="bottone-submit">Accedi</button>
    </form>

    <div class="credenziali-demo">
      <strong>Credenziali demo</strong> (password: <code>CronoService2026!</code>)<br>
      admin@cronoservice.it &middot; presidente@cronoservice.it<br>
      designatore.pa@cronoservice.it &middot; paolo.russo@cronoservice.it
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
